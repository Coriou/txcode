name: Tx brand icons

on:
  workflow_dispatch:
  push:
    branches: [fork/tx-brand-icons]
    paths:
      - .github/workflows/tx-brand-icons.yml
      - scripts/tx-brand-icons/**

permissions:
  contents: read

jobs:
  export:
    if: github.repository == 'Coriou/txcode'
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      # Vendored references contain orphaned gitlinks; omit them as in desktop preview CI.
      - name: Checkout
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git checkout --detach FETCH_HEAD
      - name: Inspect native exporter
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p icon-evidence
          sw_vers | tee icon-evidence/macos.txt
          xcodebuild -version | tee icon-evidence/xcode.txt
          tool="$(xcode-select -p)/../Applications/Icon Composer.app/Contents/Executables/ictool"
          "$tool" --version | tee icon-evidence/composer-version.json
          "$tool" --help > icon-evidence/composer-help.txt 2>&1
          cat icon-evidence/composer-help.txt
          echo "ICON_COMPOSER_TOOL=$tool" >> "$GITHUB_ENV"
      - name: Probe native legacy macOS compilation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p icon-evidence/native-macos
          xcrun actool --help > icon-evidence/actool-help.txt 2>&1 || test -s icon-evidence/actool-help.txt
          if xcrun actool assets/prod/app-icon.icon --compile icon-evidence/native-macos --platform macosx --minimum-deployment-target 12.0 --app-icon app-icon --output-partial-info-plist icon-evidence/native-macos/info.plist --output-format human-readable-text > icon-evidence/actool-probe.txt 2>&1; then
            echo success > icon-evidence/actool-result.txt
          else
            echo unsupported > icon-evidence/actool-result.txt
          fi
          cat icon-evidence/actool-probe.txt
      - name: Upload native probe
        uses: actions/upload-artifact@v4
        with:
          name: tx-native-probe-${{ github.sha }}
          path: icon-evidence/
          retention-days: 14
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false
      - name: Install exporter dependencies
        run: vp install --frozen-lockfile --filter=@t3tools/scripts...
      - name: Export existing automated variants
        run: |
          vp run icons:export
          vp run icons:check
          vp run icons:export:android
          node scripts/tx-brand-icons/export-supplemental.ts
          git diff --stat > icon-evidence/changed-assets.txt
      - name: Upload outputs and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tx-brand-icons-${{ github.sha }}
          path: |
            icon-evidence/
            assets/
            apps/web/public/*icon*
            apps/mobile/assets/android-*.png
            apps/marketing/public/*icon*
            apps/marketing/src/assets/icon*.webp
          retention-days: 14
