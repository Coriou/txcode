name: Tx brand icons

on:
  workflow_dispatch:
  push:
    branches: [fork/tx-brand-icons]
    paths:
      - .github/workflows/tx-brand-icons.yml
      - scripts/tx-brand-icons/**

permissions:
  contents: read

jobs:
  macos:
    if: github.repository == 'Coriou/txcode'
    runs-on: xcode-27
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
    steps:
      # Vendored references contain orphaned gitlinks; omit them as in desktop preview CI.
      - name: Checkout
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git checkout --detach FETCH_HEAD
      - name: Record available Icon Composer versions
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/tx-macos-icons"
          for xcode in /Applications/Xcode*.app; do
            tool="$xcode/Contents/Applications/Icon Composer.app/Contents/Executables/ictool"
            if test -x "$tool"; then
              echo "$xcode"
              "$tool" --version
            fi
          done | tee "$RUNNER_TEMP/tx-macos-icons/toolchains.txt"
      - name: Inspect native Icon Composer GUI
        run: bash scripts/tx-brand-icons/probe-gui.sh "$RUNNER_TEMP/tx-macos-icons"
      - name: Upload native macOS exports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tx-macos-icons-${{ github.sha }}
          path: ${{ runner.temp }}/tx-macos-icons/
          retention-days: 14

  export:
    if: github.repository == 'Coriou/txcode' && github.event_name == 'workflow_dispatch'
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      # Vendored references contain orphaned gitlinks; omit them as in desktop preview CI.
      - name: Checkout
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git checkout --detach FETCH_HEAD
      - name: Inspect native exporter
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p icon-evidence
          sw_vers | tee icon-evidence/macos.txt
          xcodebuild -version | tee icon-evidence/xcode.txt
          tool="$(xcode-select -p)/../Applications/Icon Composer.app/Contents/Executables/ictool"
          "$tool" --version | tee icon-evidence/composer-version.json
          "$tool" --help > icon-evidence/composer-help.txt 2>&1
          cat icon-evidence/composer-help.txt
          echo "ICON_COMPOSER_TOOL=$tool" >> "$GITHUB_ENV"
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false
      - name: Install exporter dependencies
        run: vp install --frozen-lockfile --filter=@t3tools/scripts...
      - name: Export existing automated variants
        run: |
          vp run icons:export
          vp run icons:check
          vp run icons:export:android
          node scripts/tx-brand-icons/export-supplemental.ts
          git diff --stat > icon-evidence/changed-assets.txt
      - name: Upload outputs and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tx-brand-icons-${{ github.sha }}
          path: |
            icon-evidence/
            assets/
            apps/web/public/*icon*
            apps/mobile/assets/android-*.png
            apps/marketing/public/*icon*
            apps/marketing/src/assets/icon*.webp
          retention-days: 14
